<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Integration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card custom-card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Pengelola Tugas ✍️  </h3>
                        
                        <form id="todo-form" class="d-flex gap-2 mb-4">
                            <input type="text" id="task-input" class="form-control custom-input" placeholder="Tugas baru..." autocomplete="off" required>
                            <button type="submit" class="btn btn-custom">Tambah</button>
                        </form>

                        <ul id="task-list" class="list-group list-group-flush">
                            </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
